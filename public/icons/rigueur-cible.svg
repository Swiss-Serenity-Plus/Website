<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#977b57" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer ring — gap at upper-right (300°–330°) where arrow passes through -->
  <path d="M 84.6,30 A 40,40 0 1 1 70,15.4"/>
  <!-- Middle ring -->
  <circle cx="50" cy="50" r="26"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="12"/>
  <!-- Arrow shaft from centre to upper-right, beyond outer ring -->
  <line x1="50" y1="50" x2="87" y2="13"/>
  <!-- Fletching — two wings symmetric about shaft axis (315°) -->
  <line x1="87" y1="13" x2="97" y2="14"/>
  <line x1="87" y1="13" x2="86" y2="3"/>
</svg>
