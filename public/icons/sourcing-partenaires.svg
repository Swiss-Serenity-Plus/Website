<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#977b57" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
  <!-- Person 1 (top center) -->
  <circle cx="12" cy="5.5" r="1.6"/>
  <path d="M 9.2,9 Q 12,7.4 14.8,9 L 9.2,9 Z"/>

  <!-- Person 2 (bottom-left) -->
  <circle cx="5.5" cy="16.5" r="1.6"/>
  <path d="M 2.7,20 Q 5.5,18.4 8.3,20 L 2.7,20 Z"/>

  <!-- Person 3 (bottom-right) -->
  <circle cx="18.5" cy="16.5" r="1.6"/>
  <path d="M 15.7,20 Q 18.5,18.4 21.3,20 L 15.7,20 Z"/>

  <!-- Dotted arc bottom (P3→P2, through 90°) -->
  <path d="M 16.4,19 A 7,7 0 0,1 7.6,19" stroke-dasharray="0.1 1.5"/>

  <!-- Dotted arc left (P2→P1, going upper-left) -->
  <path d="M 4.2,14.5 A 7,7 0 0,1 10,6.2" stroke-dasharray="0.1 1.5"/>

  <!-- Dotted arc right (P1→P3, going lower-right) -->
  <path d="M 14,6.2 A 7,7 0 0,1 19.8,14.5" stroke-dasharray="0.1 1.5"/>
</svg>
