<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Bar chart — 4 bars growing left to right, stroke-only -->
  <rect x="12" y="70" width="11" height="15" fill="none" stroke="#977b57" stroke-width="2" stroke-linejoin="round"/>
  <rect x="28" y="60" width="11" height="25" fill="none" stroke="#977b57" stroke-width="2" stroke-linejoin="round"/>
  <rect x="44" y="45" width="11" height="40" fill="none" stroke="#977b57" stroke-width="2" stroke-linejoin="round"/>
  <rect x="60" y="25" width="11" height="60" fill="none" stroke="#977b57" stroke-width="2" stroke-linejoin="round"/>
  <!-- Curved upward growth arrow -->
  <path d="M 14,78 Q 40,25 82,13" fill="none" stroke="#977b57" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Filled arrowhead -->
  <path d="M 82,13 L 74,20 L 72,10 Z" fill="#977b57"/>
</svg>
