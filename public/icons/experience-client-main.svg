<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#977b57" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
  <!-- Person: head -->
  <circle cx="12" cy="3.5" r="2"/>
  <!-- Person: body dome -->
  <path d="M 8,8.5 Q 12,5.5 16,8.5 L 8,8.5 Z"/>

  <!-- Wrist cuff (rectangle, left side) -->
  <rect x="1.5" y="12" width="2.5" height="4.5" rx="0.5"/>

  <!-- Top finger profile: 4 subtle bumps going right from wrist -->
  <path d="M 4,12 Q 5.5,10.5 7,11.5 Q 9,9.5 11,10.5 Q 13,9 15,10 Q 17,9.5 19.5,13"/>

  <!-- Palm underside: gentle curve connecting wrist to fingertips -->
  <path d="M 4,16.5 C 10,18.5 17,16 19.5,14"/>

  <!-- Small arc closing at fingertips (right edge of hand) -->
  <path d="M 19.5,13 Q 21,13.5 19.5,14"/>

  <!-- Thumb line visible inside open palm -->
  <path d="M 4,15 Q 10,14.5 13.5,13.5"/>
</svg>
