<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#977b57" stroke-linecap="round" stroke-linejoin="round">
  <!-- Dotted background ring (large circle linking all nodes) -->
  <circle cx="50" cy="50" r="33" stroke-width="1.5" stroke-dasharray="3 4"/>
  <!-- Diagonal lines: centre ring → corner nodes -->
  <line x1="39" y1="39" x2="30" y2="30" stroke-width="1.8"/>
  <line x1="61" y1="39" x2="70" y2="30" stroke-width="1.8"/>
  <line x1="39" y1="61" x2="30" y2="70" stroke-width="1.8"/>
  <line x1="61" y1="61" x2="70" y2="70" stroke-width="1.8"/>
  <!-- Horizontal / vertical extension lines with end nodes -->
  <line x1="34" y1="50" x2="20" y2="50" stroke-width="1.8"/>
  <line x1="66" y1="50" x2="80" y2="50" stroke-width="1.8"/>
  <line x1="50" y1="34" x2="50" y2="20" stroke-width="1.8"/>
  <line x1="50" y1="66" x2="50" y2="80" stroke-width="1.8"/>
  <!-- Diagonal node circles (hollow, white fill to appear as breaks in lines) -->
  <circle cx="30" cy="30" r="2.2" fill="white" stroke-width="1.6"/>
  <circle cx="70" cy="30" r="2.2" fill="white" stroke-width="1.6"/>
  <circle cx="30" cy="70" r="2.2" fill="white" stroke-width="1.6"/>
  <circle cx="70" cy="70" r="2.2" fill="white" stroke-width="1.6"/>
  <!-- H/V node circles -->
  <circle cx="20" cy="50" r="2.2" fill="white" stroke-width="1.6"/>
  <circle cx="80" cy="50" r="2.2" fill="white" stroke-width="1.6"/>
  <circle cx="50" cy="20" r="2.2" fill="white" stroke-width="1.6"/>
  <circle cx="50" cy="80" r="2.2" fill="white" stroke-width="1.6"/>
  <!-- Centre: double ring -->
  <circle cx="50" cy="50" r="16" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="13" stroke-width="1.8"/>
  <!-- Centre person silhouette -->
  <circle cx="50" cy="43" r="3.5" stroke-width="1.8"/>
  <path d="M 42,55 Q 50,46 58,55" stroke-width="1.8"/>
  <!-- Corner circles -->
  <circle cx="20" cy="20" r="13" stroke-width="1.8"/>
  <circle cx="80" cy="20" r="13" stroke-width="1.8"/>
  <circle cx="20" cy="80" r="13" stroke-width="1.8"/>
  <circle cx="80" cy="80" r="13" stroke-width="1.8"/>
  <!-- NW person -->
  <circle cx="20" cy="14" r="3" stroke-width="1.8"/>
  <path d="M 14,24 Q 20,18 26,24" stroke-width="1.8"/>
  <!-- NE person -->
  <circle cx="80" cy="14" r="3" stroke-width="1.8"/>
  <path d="M 74,24 Q 80,18 86,24" stroke-width="1.8"/>
  <!-- SW person -->
  <circle cx="20" cy="74" r="3" stroke-width="1.8"/>
  <path d="M 14,84 Q 20,78 26,84" stroke-width="1.8"/>
  <!-- SE person -->
  <circle cx="80" cy="74" r="3" stroke-width="1.8"/>
  <path d="M 74,84 Q 80,78 86,84" stroke-width="1.8"/>
</svg>
